name: Temporary R8 WebKit runtime
on:
  push:
    branches: [work/browser-cache-r8-2026-10-05]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: |
          mkdir -p /tmp/apco-webkit-libs
          PW_RUNTIME=/home/runner/.cache/ms-playwright/webkit-2359/minibrowser-wpe
          LD_LIBRARY_PATH="$PW_RUNTIME/lib" ldd "$PW_RUNTIME/bin/MiniBrowser" > /tmp/apco-webkit-ldd.txt
          awk '/ => \/(lib|usr\/lib)\// { print $3 }' /tmp/apco-webkit-ldd.txt | while read -r file; do
            case "$(basename "$file")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*) continue ;; esac
            cp -L "$file" "/tmp/apco-webkit-libs/$(basename "$file")"
          done
          tar -czf /tmp/apco-webkit-libs.tgz -C /tmp apco-webkit-libs
          sha256sum /tmp/apco-webkit-libs.tgz > /tmp/apco-webkit-libs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apco-webkit-libs-r8
          retention-days: 1
          path: |
            /tmp/apco-webkit-libs.tgz
            /tmp/apco-webkit-libs.sha256
            /tmp/apco-webkit-ldd.txt
