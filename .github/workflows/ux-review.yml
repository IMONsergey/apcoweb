name: Cross-browser UX review

on:
  push:
    branches: [work/contextual-billing-2026-10-05]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser scenarios
        run: npm test
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-review-${{ github.sha }}
          retention-days: 7
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
