name: Cross-browser UX review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - name: Report formatting changes
        run: |
          npx prettier --write src/config/site.ts scripts/verify-assets.mjs
          git diff -- src/config/site.ts scripts/verify-assets.mjs
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser scenarios
        run: npm test
      - name: Capture Chromium visual baselines
        run: APCO_VISUAL_CAPTURE=1 npx playwright test tests/visual-regression.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Seed reviewed R21 baselines
        if: ${{ github.head_ref == 'chore/r21-pretransfer-hardening' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir=tests/visual-regression.spec.ts-snapshots
          if [ -f "$dir/hero-desktop-light-chromium-linux.png" ]; then exit 0; fi
          mkdir -p "$dir"
          find test-results -type f -name '*-chromium-linux.png' -exec cp {} "$dir"/ \;
          if [ "$(find "$dir" -name '*.png' | wc -l)" -ne 12 ]; then
            echo "Expected 12 visual baselines"; exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/config/site.ts scripts/verify-assets.mjs "$dir"
          git commit -m "R21: preserve Linux Chromium visual baselines"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ux-review-${{ github.sha }}
          retention-days: 7
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
