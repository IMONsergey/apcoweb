name: Stage 2 visual review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-visual-review
  cancel-in-progress: true

jobs:
  review:
    if: github.head_ref == 'feat/stage2-full-website-2026-10-09' || github.ref == 'refs/heads/feat/stage2-full-website-2026-10-09'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format, lint, TypeScript and integrity
        run: npm run check
      - name: Production build with static route metadata
        run: npm run build
      - name: Local production build artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage2-production-build
          retention-days: 14
          path: dist/
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Route and functional tests across three browsers
        run: npx playwright test tests/stage2-routes.spec.ts tests/stage2-functional.spec.ts
      - name: Full-page screenshot review (94 frames)
        run: npx playwright test tests/stage2-visual-review.spec.ts --project=chromium
      - name: Original R21 and Stage 2 comparison
        if: always()
        run: |
          python3 -m pip install --user pillow
          python3 scripts/build-stage2-review-contact-sheet.py
      - name: Full review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage2-visual-review
          retention-days: 14
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
