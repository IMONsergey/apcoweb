name: Stage 2 formatting check output

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'feat/stage2-full-website-2026-10-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format commercial page into an artifact without modifying git
        run: |
          cp src/pages/CommercialPages.tsx before-commercial.tsx
          npx prettier src/pages/CommercialPages.tsx > formatted-commercial.tsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage2-formatted-commercial
          retention-days: 1
          path: |
            before-commercial.tsx
            formatted-commercial.tsx
