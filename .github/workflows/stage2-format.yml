name: Stage 2 final source formatting
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/stage2-full-website-2026-10-09'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/stage2-full-website-2026-10-09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply standard formatting
        run: |
          npx prettier --write src tests docs README.md *.json *.ts *.js *.html
          git config user.name "stage2-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Stage 2 code and test formatting"
            git push origin HEAD:feat/stage2-full-website-2026-10-09
          fi
